services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:?Defina DB_PASSWORD no ambiente antes de subir o MySQL de teste}"
      MYSQL_DATABASE: estanteweb
    ports:
      - "3307:3306"
    volumes:
      - mysql-teste10:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql-teste10:
